[package]
name = "kaarjoo-installer"
version = "1.0.0"
description = "Kaarjoo Modern Bootstrap Installer"
authors = ["Kaarjoo Team"]
edition = "2021"

[lib]
name = "kaarjoo_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
