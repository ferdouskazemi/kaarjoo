[package]
name = "kaarjoo-desktop"
version = "0.1.0"
description = "Kaarjoo (کارجو) - Local-First AI Job Application Desktop App"
authors = ["Kaarjoo Authors"]
edition = "2021"
default-run = "kaarjoo-desktop"

[lib]
name = "kaarjoo_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-notification = "2.2.0"
tauri-plugin-process = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["javascript", "typescript"] }
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
specta-typescript = "=0.0.7"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2.2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
