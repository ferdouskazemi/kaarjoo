<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Greenhouse Mock Job Application</title>
</head>
<body>
  <h1>Apply for Senior Software Engineer</h1>
  <form id="application_form" action="#confirmation" method="POST" onsubmit="event.preventDefault(); document.getElementById('application_confirmation').style.display = 'block'; document.getElementById('application_form').style.display = 'none';">
    <div>
      <label for="first_name">First Name *</label>
      <input type="text" id="first_name" name="job_application[first_name]" required>
    </div>
    <div>
      <label for="last_name">Last Name *</label>
      <input type="text" id="last_name" name="job_application[last_name]" required>
    </div>
    <div>
      <label for="email">Email *</label>
      <input type="email" id="email" name="job_application[email]" required>
    </div>
    <div>
      <label for="phone">Phone *</label>
      <input type="tel" id="phone" name="job_application[phone]" required>
    </div>
    <div>
      <label for="resume">Resume / CV *</label>
      <input type="file" id="resume" name="job_application[resume]" required>
    </div>
    <div>
      <label for="cover_letter">Cover Letter</label>
      <textarea id="cover_letter" name="job_application[cover_letter]"></textarea>
    </div>
    <div>
      <label for="linkedin_url">LinkedIn Profile</label>
      <input type="url" id="linkedin_url" name="job_application[urls][LinkedIn]">
    </div>
    <div>
      <label for="github_url">GitHub URL</label>
      <input type="url" id="github_url" name="job_application[urls][GitHub]">
    </div>
    <div>
      <label for="work_auth">Are you legally authorized to work in the United States? *</label>
      <select id="work_auth" name="job_application[answers][work_auth]" required>
        <option value="">-- Please Select --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div>
      <label for="gender">Demographics: Gender</label>
      <select id="gender" name="job_application[gender]">
        <option value="">-- Select --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="decline">I decline to self-identify</option>
      </select>
    </div>
    <div style="margin-top: 20px;">
      <button type="submit" id="submit_app">Submit Application</button>
    </div>
  </form>

  <div id="application_confirmation" style="display: none;">
    <h2>Thank you for applying!</h2>
    <p>Your application has been submitted successfully to the engineering team.</p>
  </div>
</body>
</html>
